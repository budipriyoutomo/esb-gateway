# Runs inside the app container beside php-fpm (ADR-033). Sits behind Nginx
# Proxy Manager, which terminates TLS, and is reached only over the proxy's
# Docker network -- the container publishes no host port.

# Nginx Proxy Manager appends the address it saw to any X-Forwarded-For the
# client sent, and Symfony reads the LEFT-most entry. Forward only the
# right-most one (the address NPM saw) so a client cannot choose its own IP.
map $http_x_forwarded_for $client_forwarded_for {
    default                    "";
    "~(?<last>[^,\s]+)\s*$"    $last;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    charset utf-8;

    # Keep in step with post_max_size in docker/php/conf.d/zz-production.ini.
    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite output is content-hashed, so it can be cached forever.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Setting an HTTP_* param replaces the request header of that name.
        fastcgi_param HTTP_X_FORWARDED_FOR $client_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_PROXY "";

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 140s;
    }

    # Nothing but the front controller is executable.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
