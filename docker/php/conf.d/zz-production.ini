; Production overrides on top of php.ini-production.

expose_php = Off
memory_limit = 512M
max_execution_time = 120

; Excel template imports (openspout). Keep in step with client_max_body_size in
; docker/nginx/default.conf and the upload limit in Nginx Proxy Manager.
upload_max_filesize = 20M
post_max_size = 25M

; Application timestamps are UTC (APP_TIMEZONE); ESB times are converted
; explicitly on ingest.
date.timezone = UTC

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code is immutable inside the image; a deploy is a new container.
opcache.validate_timestamps = 0
