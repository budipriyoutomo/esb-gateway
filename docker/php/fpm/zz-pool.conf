; Loaded after the image's www.conf and zz-docker.conf.
[www]
; nginx runs in the same container (ADR-033); nothing else needs FastCGI.
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Keep the container environment visible to PHP workers. Config is cached at
; start, but anything still reading getenv() must not see an empty env.
clear_env = no

; A little above max_execution_time, so PHP's own limit fires first.
request_terminate_timeout = 130s
